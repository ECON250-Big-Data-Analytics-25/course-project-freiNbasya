version: 2

models:
  - name: fp_stg_customers
    description: Staging model for fp_customers; no derived columns
    columns:
      - name: customer_id
        description: key to the orders dataset. Each order has a unique customer_id.
        tests:
          - not_null
      - name: customer_unique_id
        description: unique identifier of a customer.
        tests:
          - not_null
      - name: customer_zip_code_prefix
        description: first five digits of customer zip code
      - name: customer_city
        description: customer city name
      - name: customer_state
        description: customer state
  - name: fp_stg_order_items
    description: Staging model for fp_order_items; Derived column sum of price and shipping price (freight_value)
    columns:
      - name: order_id
        description: order unique identifier
        tests:
          - not_null
      - name: order_item_id
        description: sequential number identifying number of items included in the same order.
        tests:
          - not_null
      - name: product_id
        description: product unique identifier
        tests:
          - not_null
      - name: seller_id
        description: seller unique identifier
        tests:
          - not_null
      - name: shipping_limit_date
        description: Shows the seller shipping limit date for handling the order over to the logistic partner.
      - name: price
        description: item price
      - name: freight_value
        description: item freight value item (if an order has more than one item the freight value is splitted between items)
      - name: total_price
        description: total of price and freight value
  - name: fp_stg_order_payments
    description: Staging model for fp_order_payments; Derived column checks whether payment was made by credit card, which is the most popular payment method
    columns:
      - name: order_id
        description: unique identifier of an order.
        tests:
          - not_null
      - name: payment_sequential
        description: a customer may pay an order with more than one payment method. If he does so, a sequence will be created to accommodate all payments.
      - name: payment_type
        description: method of payment chosen by the customer.
        tests:
          - not_null
          - accepted_values:
              values:
                - credit_card
                - boleto
                - voucher
                - debit_card
                - not_defined
      - name: payment_installments
        description: number of installments chosen by the customer.
      - name: payment_value
        description: transaction value.
      - name: is_credit_card
        description: checks whether payment was made by credit card
        tests:
          - not_null
  - name: fp_stg_orders
    description: Staging model for fp_orders; Derived column shows how long it takes from order being approved to being delivered to customer
    columns:
      - name: order_id
        description: unique identifier of the order.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: key to the customer dataset. Each order has a unique customer_id.
        tests:
          - not_null
      - name: order_status
        description: Reference to the order status (delivered, shipped, etc).
        tests:
          - not_null
          - accepted_values:
              values:
                - approved
                - canceled
                - created
                - delivered
                - invoiced
                - processing
                - shipped
                - unavailable
      - name: order_purchase_timestamp
        description: Shows the purchase timestamp.
      - name: order_approved_at
        description: Shows the payment approval timestamp.
      - name: order_delivered_carrier_date
        description: Shows the order posting timestamp. When it was handled to the logistic partner.
      - name: order_delivered_customer_date
        description: Shows the actual order delivery date to the customer.
      - name: order_estimated_delivery_date
        description: Shows the estimated delivery date that was informed to customer at the purchase moment.
      - name: delivery_time
        description: shows how long it takes from approved order to being delivered to customer
  - name: fp_stg_product_category_name_translation
    description: Staging model for fp_product_category_name_translation; Derived column shows whether original and localized names are the same
    columns:
      - name: product_category_name
        description: category name in Portuguese
      - name: product_category_name_english
        description: category name in English
      - name: is_same
        description: shows whether original and localized names are the same
  - name: fp_stg_products
    description: Staging model for fp_products; Derived column shows the volume of the product
    columns:
      - name: product_id
        description: unique product identifier
        tests:
          - unique
          - not_null
      - name: product_category_name
        description: root category of product, in Portuguese.
      - name: product_name_lenght
        description: number of characters extracted from the product name.
      - name: product_description_lenght
        description: number of characters extracted from the product description.
      - name: product_photos_qty
        description: number of product published photos
      - name: product_weight_g
        description: product weight measured in grams.
      - name: product_length_cm
        description: product length measured in centimeters.
      - name: product_height_cm
        description: product height measured in centimeters.
      - name: product_width_cm
        description: product width measured in centimeters.
      - name: product_volume
        description: Shows the volume of the product
  - name: fp_stg_sellers
    description: Staging model for fp_sellers
    columns:
      - name: seller_id
        description: seller unique identifier
        tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: first 5 digits of seller zip code
      - name: seller_city
        description: seller city name
      - name: seller_state
        description: seller state
  - name: fp_sales_full
    description: Consolidated orders table combining order, customer, order items, payment, and seller data.The table is partitioned by order_purchase_timestamp and clustered by customer_id.
    columns:
      - name: order_id
        description: Unique identifier for order
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Unique identifier for a customer 
        tests:
          - not_null
      - name: customer_state
        description: Customer state
      - name: customer_city
        description: Customer city name
      - name: order_status
        description: Reference to the order status (delivered, shipped, etc).
        tests:
          - not_null
      - name: order_purchase_timestamp
        description: Shows the purchase timestamp.
        tests:
          - not_null
      - name: order_approved_at
        description: Shows the payment approval timestamp.
      - name: order_delivered_customer_date
        description: Shows the actual order delivery date to the customer.
      - name: order_estimated_delivery_date
        description: Shows the estimated delivery date that was informed to customer at the purchase moment.
      - name: delivery_time
        description: Duration from order approval to delivery.
      - name: order_total_price
        description: Total price for the order from order items.
        tests:
          - not_null
      - name: order_total_freight
        description: Total freight (shipping) cost for the order.
      - name: product_categories_english
        description: Array of product category names in English associated with the order items.
      - name: product_categories_original
        description: Aarray of the original product category names (in Portuguese) for the order items.
      - name: sellers
        description: Information on sellers for the order. Stored as an array of structs containing seller_id, seller_city, and seller_state.
      - name: order_payments
        description: Payment details for the order, stored as an array of structs containing payment_type, payment_installments, payment_value, and is_credit_card.
  - name: fp_fct_order_performance_analysis
    description: Monthly order performance analysis
    columns:
      - name: order_year
        description: Year extracted from the order_purchase_timestamp
        tests:
          - not_null
      - name: order_month
        description: Month extracted from the order_purchase_timestamp
        tests:
          - not_null
      - name: customer_state
        description: State where the customer is located.
      - name: order_status
        description: The status of the order
      - name: total_orders
        description: Count of distinct orders 
        tests:
          - not_null
      - name: total_revenue
        description: Sum of order_total_price for all orders in the group, representing the revenue
      - name: avg_order_value
        description: Average value of orders in the group, computed from order_total_price
  - name: fp_fct_payment_analysis
    description: Payment method trends, installment patterns and regional preferences analysis
    columns:
      - name: payment_type
        description: Type of payment method used
        tests:
          - not_null
      - name: payment_count
        description: Count of payments for each payment type
      - name: avg_installments
        description: Average number of installments used per payment type
      - name: total_payment_value
        description: Total sum of payment values aggregated by payment type
  - name: fp_fct_product_performance
    description: Analysis of top performing product categories by region, price, or time period
    columns:
      - name: order_year
        description: Year extracted from the order_purchase_timestamp
        tests:
          - not_null
      - name: order_month
        description: Month extracted from the order_purchase_timestamp
        tests:
          - not_null
      - name: customer_state
        description: State in which the customer is located
      - name: product_category
        description: Product category in English associated with the order
        tests:
          - not_null
      - name: orders
        description: Count of distinct orders
      - name: total_revenue
        description: Total revenue from orders